on:
  - push
  - pull_request

name: Test and lint

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cabal:
          - 3.10.3.0
        ghc:
          - 9.2.5
    env:
      CONFIG: "--enable-tests --enable-benchmarks"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: haskell/actions/setup@ce6c3a6f8cbe3bd6ce51b635b3f32ee792f22f91 # v2.4.7
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - run: cabal v2-update $CONFIG
      - run: cabal v2-build $CONFIG
      - run: cabal v2-test $CONFIG
      - run: cabal v2-haddock $CONFIG
      - run: cabal v2-sdist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 'Set up HLint'
        uses: haskell/actions/hlint-setup@ce6c3a6f8cbe3bd6ce51b635b3f32ee792f22f91 # v2.4.7

      - name: 'Run HLint'
        uses: haskell/actions/hlint-run@ce6c3a6f8cbe3bd6ce51b635b3f32ee792f22f91 # v2.4.7
        with:
          path: '["src/", "tests/", "app/"]'
          fail-on: warning
